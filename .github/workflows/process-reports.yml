name: Process Handle Reports

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-report:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '[REPORT]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Process Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Parse issue title: [REPORT] @handle - category_id
            const title = context.payload.issue.title;
            const match = title.match(/\[REPORT\]\s*@?(\w+)\s*-\s*(\w+)/i);
            
            if (!match) {
              console.log('Invalid report format');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ Invalid report format. Please use: `[REPORT] @handle - category_id`\n\nValid categories: `bjp_it_cell`, `congress_it_cell`, `aap_it_cell`, `paid_promoter`, `bot_automated`, `propaganda`'
              });
              return;
            }
            
            const handle = match[1].toLowerCase();
            const category = match[2].toLowerCase();
            const reporter = context.payload.issue.user.login;
            
            // Load handles database
            const dbPath = 'data/handles.json';
            const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
            
            // Validate category
            if (!db.categories[category]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ Invalid category: \`${category}\`\n\nValid categories: ${Object.keys(db.categories).map(c => '\`' + c + '\`').join(', ')}`
              });
              return;
            }
            
            // Check if handle is already in main list
            if (db.handles[handle]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `ℹ️ @${handle} is already flagged as **${db.categories[db.handles[handle].category].label}**.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                labels: ['duplicate']
              });
              return;
            }
            
            // Initialize pending reports if not exists
            if (!db.pendingReports) {
              db.pendingReports = {};
            }
            
            // Initialize pending reports for this handle if not exists
            if (!db.pendingReports[handle]) {
              db.pendingReports[handle] = {
                category: category,
                reporters: [],
                issues: []
              };
            }
            
            const pending = db.pendingReports[handle];
            
            // Check if already reported by this user
            if (pending.reporters.includes(reporter)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `ℹ️ You have already reported @${handle}. Current report count: ${pending.reporters.length}/${db.reportThreshold}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                labels: ['duplicate-reporter']
              });
              return;
            }
            
            // Add reporter
            pending.reporters.push(reporter);
            pending.issues.push(context.payload.issue.number);
            
            // Check if threshold reached
            if (pending.reporters.length >= db.reportThreshold) {
              // Add to main handles list
              db.handles[handle] = {
                category: category,
                reportCount: pending.reporters.length,
                addedAt: new Date().toISOString(),
                reporters: pending.reporters
              };
              
              // Remove from pending
              delete db.pendingReports[handle];
              
              // Update timestamp
              db.lastUpdated = new Date().toISOString();
              
              // Close all related issues
              for (const issueNum of pending.issues) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum,
                    body: `✅ @${handle} has been added to the database as **${db.categories[category].label}** with ${pending.reporters.length} reports.\n\nThank you for contributing to a more transparent Twitter!`
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum,
                    state: 'closed',
                    labels: ['verified', category]
                  });
                } catch (e) {
                  console.log(`Could not update issue ${issueNum}: ${e.message}`);
                }
              }
              
              console.log(`✅ Added @${handle} to database as ${category}`);
            } else {
              // Comment on progress
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `📊 Report recorded for @${handle} as **${db.categories[category].label}**.\n\n**Current reports:** ${pending.reporters.length}/${db.reportThreshold}\n\nThe handle will be added to the database when ${db.reportThreshold} unique users report it.`
              });
              
              // Add labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['pending', category]
              });
              
              console.log(`📊 Report recorded: @${handle} (${pending.reporters.length}/${db.reportThreshold})`);
            }
            
            // Save database
            fs.writeFileSync(dbPath, JSON.stringify(db, null, 2));
            
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Xpose Bot"
          git add data/handles.json
          git diff --staged --quiet || git commit -m "📊 Update handles database [automated]"
          git push
