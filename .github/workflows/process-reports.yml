name: Process Handle Reports

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-report:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '[REPORT]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Process Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Parse issue title: [REPORT] @handle - category_id
            const title = context.payload.issue.title;
            const match = title.match(/\[REPORT\]\s*@?(\w+)\s*-\s*(\w+)/i);
            
            if (!match) {
              console.log('Invalid report format');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ Invalid report format. Please use: `[REPORT] @handle - category_id`'
              });
              return;
            }
            
            const handle = match[1].toLowerCase();
            const category = match[2].toLowerCase();
            const reporter = context.payload.issue.user.login;
            
            // Load handles database
            const dbPath = 'data/handles.json';
            const db = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
            
            // Validate category
            if (!db.categories[category]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ Invalid category: \`${category}\`\n\nValid categories: ${Object.keys(db.categories).map(c => '\`' + c + '\`').join(', ')}`
              });
              return;
            }
            
            // Initialize pendingReports if not exists
            if (!db.pendingReports) {
              db.pendingReports = {};
            }
            
            // Check if handle already exists in main list
            if (db.handles[handle]) {
              const handleData = db.handles[handle];
              
              // Check if this category already exists for this handle
              if (handleData.categories[category]) {
                const catData = handleData.categories[category];
                
                // Check if user already reported this handle for this category
                if (catData.reporters.includes(reporter)) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.issue.number,
                    body: `ℹ️ You have already reported @${handle} as **${db.categories[category].label}**.\n\nCurrent reports for this category: ${catData.count}`
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.issue.number,
                    state: 'closed',
                    labels: ['duplicate-reporter']
                  });
                  return;
                }
                
                // Add reporter to existing category
                catData.reporters.push(reporter);
                catData.count = catData.reporters.length;
                handleData.totalReports++;
                db.lastUpdated = new Date().toISOString();
                
                // Get primary category (highest count)
                const primaryCat = Object.entries(handleData.categories)
                  .sort((a, b) => b[1].count - a[1].count)[0];
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: `✅ Report added! @${handle} now has **${catData.count}** reports as **${db.categories[category].label}**.\n\n**Total reports:** ${handleData.totalReports}\n**Primary category:** ${db.categories[primaryCat[0]].label} (${primaryCat[1].count} reports)`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed',
                  labels: ['verified', category]
                });
                
                console.log(`✅ Added report to existing category: @${handle} - ${category}`);
              } else {
                // New category for existing handle
                handleData.categories[category] = {
                  count: 1,
                  reporters: [reporter],
                  firstReported: new Date().toISOString()
                };
                handleData.totalReports++;
                db.lastUpdated = new Date().toISOString();
                
                // Get all categories for this handle
                const catList = Object.entries(handleData.categories)
                  .sort((a, b) => b[1].count - a[1].count)
                  .map(([id, data]) => `• **${db.categories[id].label}**: ${data.count} reports`)
                  .join('\n');
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: `✅ New category added! @${handle} is now also flagged as **${db.categories[category].label}**.\n\n**All categories:**\n${catList}\n\n**Total reports:** ${handleData.totalReports}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed',
                  labels: ['verified', category, 'new-category']
                });
                
                console.log(`✅ Added new category to existing handle: @${handle} - ${category}`);
              }
            } else {
              // Handle doesn't exist yet - check pending reports
              if (!db.pendingReports[handle]) {
                db.pendingReports[handle] = { categories: {} };
              }
              
              const pending = db.pendingReports[handle];
              
              if (!pending.categories[category]) {
                pending.categories[category] = {
                  reporters: [],
                  issues: []
                };
              }
              
              const pendingCat = pending.categories[category];
              
              // Check if already reported by this user for this category
              if (pendingCat.reporters.includes(reporter)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: `ℹ️ You have already reported @${handle} as **${db.categories[category].label}**.\n\nCurrent pending reports: ${pendingCat.reporters.length}/${db.reportThreshold}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed',
                  labels: ['duplicate-reporter']
                });
                return;
              }
              
              // Add reporter to pending
              pendingCat.reporters.push(reporter);
              pendingCat.issues.push(context.payload.issue.number);
              
              // Check if threshold reached for this category
              if (pendingCat.reporters.length >= db.reportThreshold) {
                // Create new handle entry with multi-category structure
                db.handles[handle] = {
                  categories: {
                    [category]: {
                      count: pendingCat.reporters.length,
                      reporters: pendingCat.reporters,
                      firstReported: new Date().toISOString()
                    }
                  },
                  totalReports: pendingCat.reporters.length,
                  addedAt: new Date().toISOString()
                };
                
                // Check if there are other pending categories for this handle
                for (const [otherCat, otherData] of Object.entries(pending.categories)) {
                  if (otherCat !== category && otherData.reporters.length >= db.reportThreshold) {
                    db.handles[handle].categories[otherCat] = {
                      count: otherData.reporters.length,
                      reporters: otherData.reporters,
                      firstReported: new Date().toISOString()
                    };
                    db.handles[handle].totalReports += otherData.reporters.length;
                  }
                }
                
                // Remove from pending
                delete db.pendingReports[handle];
                
                db.lastUpdated = new Date().toISOString();
                
                // Close all related issues for this category
                for (const issueNum of pendingCat.issues) {
                  try {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNum,
                      body: `✅ @${handle} has been added to the database as **${db.categories[category].label}** with ${pendingCat.reporters.length} reports.\n\nThank you for contributing to Xpose!`
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNum,
                      state: 'closed',
                      labels: ['verified', category]
                    });
                  } catch (e) {
                    console.log(`Could not update issue ${issueNum}: ${e.message}`);
                  }
                }
                
                console.log(`✅ Added @${handle} to database as ${category}`);
              } else {
                // Not yet at threshold - comment on progress
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: `📊 Report recorded for @${handle} as **${db.categories[category].label}**.\n\n**Current reports:** ${pendingCat.reporters.length}/${db.reportThreshold}\n\nThe handle will be added to the database when ${db.reportThreshold} unique users report it.`
                });
                
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: ['pending', category]
                });
                
                console.log(`📊 Report recorded: @${handle} - ${category} (${pendingCat.reporters.length}/${db.reportThreshold})`);
              }
            }
            
            // Save database
            fs.writeFileSync(dbPath, JSON.stringify(db, null, 2));
            
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Xpose Bot"
          
          # Check if there are changes to commit
          git add data/handles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit locally
          git commit -m "📊 Update handles database [automated]"
          
          # Retry loop to handle concurrent updates
          MAX_RETRIES=3
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            # Try to rebase and push
            if git pull --rebase -X ours origin main && git push origin main; then
              echo "✅ Push successful"
              exit 0
            fi
            
            # If rebase failed with conflicts, abort and try again
            git rebase --abort 2>/dev/null || true
            
            RETRY=$((RETRY + 1))
            echo "⚠️ Attempt $RETRY failed, retrying..."
            sleep 2
          done
          
          echo "❌ Failed after $MAX_RETRIES retries"
          exit 1
