<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator - X Tweet Assistant</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #f5f5f5; }
    h1 { color: #1d9bf0; }
    .icon-preview { display: flex; gap: 20px; margin: 20px 0; }
    .icon-box { background: white; padding: 20px; border-radius: 8px; text-align: center; }
    canvas { border: 1px solid #ddd; }
    button { background: #1d9bf0; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin: 5px; }
    button:hover { background: #1a8cd8; }
  </style>
</head>
<body>
  <h1>X Tweet Assistant - Icon Generator</h1>
  <p>Click the buttons below to download PNG icons for the extension.</p>
  
  <div class="icon-preview">
    <div class="icon-box">
      <canvas id="icon16" width="16" height="16"></canvas>
      <br><button onclick="download(16)">Download 16x16</button>
    </div>
    <div class="icon-box">
      <canvas id="icon48" width="48" height="48"></canvas>
      <br><button onclick="download(48)">Download 48x48</button>
    </div>
    <div class="icon-box">
      <canvas id="icon128" width="128" height="128"></canvas>
      <br><button onclick="download(128)">Download 128x128</button>
    </div>
  </div>
  
  <button onclick="downloadAll()">Download All Icons</button>

  <script>
    function drawIcon(ctx, size) {
      const scale = size / 128;
      
      // Background
      ctx.fillStyle = '#1D9BF0';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, 24 * scale);
      ctx.fill();
      
      // Main star
      ctx.fillStyle = 'white';
      ctx.beginPath();
      const cx = size / 2, cy = size / 2 - 8 * scale;
      const outerR = 32 * scale, innerR = 12 * scale;
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = (i * Math.PI / 4) - Math.PI / 2;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      
      // Small sparkles
      ctx.globalAlpha = 0.7;
      drawSparkle(ctx, 28 * scale, 96 * scale, 12 * scale);
      drawSparkle(ctx, 100 * scale, 24 * scale, 10 * scale);
      ctx.globalAlpha = 1;
    }
    
    function drawSparkle(ctx, x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size * 0.3, y);
      ctx.lineTo(x, y + size);
      ctx.lineTo(x - size * 0.3, y);
      ctx.closePath();
      ctx.fill();
    }
    
    // Draw all icons
    [16, 48, 128].forEach(size => {
      const canvas = document.getElementById('icon' + size);
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
    });
    
    function download(size) {
      const canvas = document.getElementById('icon' + size);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      [16, 48, 128].forEach(size => download(size));
    }
  </script>
</body>
</html>
